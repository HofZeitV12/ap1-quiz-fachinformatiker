name: Qualität

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Alte Läufe abbrechen — ein neuer Vorschlag wartet nicht auf einen überholten Lauf.
concurrency:
  group: qualitaet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Aufbau, Syntax des Anwendungscodes, Vertrag mit dem Backend,
      # Inhaltsbestand und Jahrgangs-Regel, Secret-Muster, vercel.json.
      #
      # Braucht keine Abhängigkeiten: npm install würde 15 Sekunden kosten
      # und nichts hinzufügen. Deshalb kein "cache: npm" und kein "npm ci".
      - name: Prüfen
        run: npm run check
